; KleinerAnzeigeComputer (KAC) – custom firmware for the GeekMagic SmallTV Ultra (ESP8266 / ESP-12F, ST7789 240×240)
;
; Build:   pio run                      public image without a key: each device creates its own
;          KAC_TOKEN=<secret> pio run   private image: <secret> becomes the initial device key (never publish it)
; Image layout like the factory firmware: Arduino eboot at 0x0, application at 0x1000, DIO, 4 MB, 40 MHz,
; layout 4m2m (application max. ~1 MB). The factory update page accepts it directly.

[env:smalltv]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.2.1
    ricmoo/QRCode@0.0.1

build_flags =
    -DKAC_TOKEN=\"${sysenv.KAC_TOKEN}\"
    -DKAC_VERSION=\"0.8.0\"
    ; TFT_eSPI settings (instead of User_Setup.h)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DTFT_CS=-1
    -DTFT_DC=0
    -DTFT_RST=2
    -DTFT_SPI_MODE=SPI_MODE3
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
